[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "covalir"
version = "0.1.0-dev"
description = "Open-source PyTorch-to-SystemVerilog FPGA compiler and verified RTL primitives (early dev)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "fusesoc>=2.4",
]

[project.scripts]
covalir = "covalir.cli:main"

[tool.setuptools.packages.find]
where = ["compiler"]
