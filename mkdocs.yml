site_name: CovalIR
site_description: Open-source LLM-to-SystemVerilog compiler for FPGAs.
site_url: https://covalir.github.io/covalir/
repo_url: https://github.com/covalir/covalir
repo_name: covalir/covalir
edit_uri: edit/main/docs/

theme:
  name: material
  font:
    text: Manrope
    code: Sometype Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Overview: index.md
  - Architecture:
      - Roofline & Phase 1 Plan: ARCHITECTURE_MASTERPLAN.md
      - Phase 1 Spec (TinyStories-15M): specs/phase1_tinystories15m.md
      - Monorepo & EDA Standards: OPENTITAN_ORG_BLUEPRINT.md
  - Hardware IPs:
      - IP Catalog & Verification: hardware/index.md
  - Compiler & CLI:
      - CLI & Synthesis Guide: compiler/index.md
  - Status: status.md
